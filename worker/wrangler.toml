name = "chicco-booking-api"
main = "src/index.js"
compatibility_date = "2026-09-16"
workers_dev = true

routes = [
  { pattern = "demobooking.peji.ca/*", zone_name = "peji.ca" },
  { pattern = "demobooking.peji.ca", custom_domain = true },
  { pattern = "www.peji.ca/demo_booking*", zone_name = "peji.ca" },
  { pattern = "peji.ca/demo_booking*", zone_name = "peji.ca" }
]

[triggers]
crons = ["0 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://p3ji.github.io,https://www.peji.ca,https://peji.ca,https://demobooking.peji.ca,https://www.peji.com,http://localhost:4173"
COORDINATOR_EMAIL = "pejisystems@gmail.com"
BOOKING_FROM_EMAIL = "Demo Optometry <bookings@peji.ca>"
PUBLIC_API_URL = "https://chicco-booking-api.push-peji.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "chicco-bookings"
database_id = "1b19eb1d-128d-4781-85d0-cc2589bec35a"
migrations_dir = "migrations"
